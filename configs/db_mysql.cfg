# SQLMap MySQL-Optimized Profile
# Use: MySQL/MariaDB targets - faster by skipping other DBMS tests
# Command: sqlmap -u "URL" --config=configs/db_mysql.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 0
timeout = 30
retries = 3

[Optimization]
threads = 5
predict-output = True
keep-alive = True

[Detection]
dbms = mysql
level = 1
risk = 1

[General]
batch = True
