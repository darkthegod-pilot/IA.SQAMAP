# SQLMap Stealth Scan Profile
# Use: Low-and-slow mode, minimal detection footprint
# Command: sqlmap -u "URL" --config=configs/stealth_scan.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 3
timeout = 60
retries = 2

[Optimization]
threads = 1
predict-output = True
keep-alive = False

[Detection]
level = 1
risk = 1

[Tamper]
# Uncomment tamper chain if WAF present:
# tamper = space2comment,randomcase

[General]
batch = True
smart = True
