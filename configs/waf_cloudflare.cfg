# SQLMap Cloudflare WAF Bypass Profile
# Use: Targets protected by Cloudflare
# Command: sqlmap -u "URL" --config=configs/waf_cloudflare.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 2
timeout = 60
retries = 5

[Optimization]
threads = 2
predict-output = True
keep-alive = True

[Detection]
level = 2
risk = 2

[Tamper]
tamper = space2comment,randomcase,charencode

[General]
batch = True
smart = True
