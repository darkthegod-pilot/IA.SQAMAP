# SQLMap Aggressive Scan Profile
# Use: Maximum speed, CTF/lab environments, no stealth required
# WARNING: High traffic volume, easily detected
# Command: sqlmap -u "URL" --config=configs/aggressive_scan.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 0
timeout = 15
retries = 3

[Optimization]
threads = 10
predict-output = True
keep-alive = True
null-connection = True

[Detection]
level = 5
risk = 3

[General]
batch = True
