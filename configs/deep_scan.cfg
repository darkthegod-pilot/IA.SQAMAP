# SQLMap Deep Scan Profile
# Use: Thorough coverage, all techniques, all parameter types
# Command: sqlmap -u "URL" --config=configs/deep_scan.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 1
timeout = 60
retries = 5

[Optimization]
threads = 5
predict-output = True
keep-alive = True

[Detection]
level = 5
risk = 3

[General]
batch = True
