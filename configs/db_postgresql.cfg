# SQLMap PostgreSQL-Optimized Profile
# Use: PostgreSQL targets
# Command: sqlmap -u "URL" --config=configs/db_postgresql.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 0
timeout = 30
retries = 3

[Optimization]
threads = 5
predict-output = True
keep-alive = True

[Detection]
dbms = postgresql
level = 1
risk = 1

[General]
batch = True
