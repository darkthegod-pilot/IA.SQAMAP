# SQLMap Quick Scan Profile
# Use: First-pass vulnerability detection, minimal traffic
# Command: sqlmap -u "URL" --config=configs/quick_scan.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 0
timeout = 30
retries = 3

[Optimization]
threads = 3
predict-output = True
keep-alive = True

[Detection]
level = 1
risk = 1

[General]
batch = True
smart = True
