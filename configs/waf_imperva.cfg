# SQLMap Imperva (Incapsula) WAF Bypass Profile
# Use: Targets protected by Imperva/Incapsula
# Command: sqlmap -u "URL" --config=configs/waf_imperva.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 2
timeout = 60
retries = 5

[Optimization]
threads = 2
predict-output = True

[Detection]
level = 2
risk = 2

[Tamper]
tamper = space2comment,randomcase,between,greatest,charencode

[General]
batch = True
smart = True
