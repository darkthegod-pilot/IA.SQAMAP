# SQLMap ModSecurity WAF Bypass Profile
# Use: Targets protected by ModSecurity / OWASP CRS
# Command: sqlmap -u "URL" --config=configs/waf_modsecurity.cfg

[Target]
# url = http://target.com/page.php?id=1

[Request]
random-agent = True
delay = 1
timeout = 60
retries = 5

[Optimization]
threads = 3
predict-output = True

[Detection]
level = 2
risk = 2

[Tamper]
# MySQL target (most common with ModSecurity)
tamper = modsecurityzeroversioned,space2comment,randomcase

# If above fails, try:
# tamper = space2comment,randomcase,between,charencode

[General]
batch = True
